<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я в интернете</title>

    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .card {
            background-color: #2c2c2c;
            width: 90%;
            max-width: 400px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        button {
            background-color: #ff9800;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffa726;
        }

        #screamer1, #screamer2 {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Привет, я новичок 😎</h1>
    <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExaW1oMGk3cmUzMmhlM2hyMHpicWV1YWxrOTVtNWtuMzNjcnp6MTh6OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/yMHyX4TbUD6vXh6AJ9/giphy.gif" width="250">
    <p>Я делаю свой первый сайт!</p>

    <button onclick="showScreamer()">
        Нажми если смелый 😈
    </button>
</div>

<div id="screamer1">
    <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3NtdjR5NTdzbGJuemUzcXh1Y2JqbXNwNTZ5MjV3NjA2MmhkYXF2ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/0q6U4yy7dxfVAvSbHj/giphy.gif" width="500">
    <button onclick="showSecondScreamer()">Спастись 😭</button>
</div>

<div id="screamer2">
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExY3B0eXI1bXk4aHNlZHJnNG9zcmluMmwwNHloZXZqcHdkN3RubXNkNiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/RNbaDn4LCehdPx7HJP/giphy.gif">
     <button onclick="closeSecond()"> Я не могу дышать 😭</button>
</div>

<script>
function showScreamer() {
    document.getElementById("screamer1").style.display = "flex";
}

function showSecondScreamer() {
    document.getElementById("screamer1").style.display = "none";
    document.getElementById("screamer2").style.display = "flex";
}
function closeSecond() {
    document.getElementById("screamer2").style.display = "none";
}
</script>

</body>

</html>
